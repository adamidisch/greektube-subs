name: v8.1 WhisperX proof

on:
  workflow_dispatch:
  push:
    branches:
      - preview/translation-pipeline-v8-1-youtube-asr
    paths:
      - worker/proof-request-v81.txt

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Verify isolated proof credentials
        env:
          AUDIO_TIMING_DATABASE_URL: ${{ secrets.V81_AUDIO_TIMING_DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$AUDIO_TIMING_DATABASE_URL" || { echo "Missing V81_AUDIO_TIMING_DATABASE_URL"; exit 1; }
          test -n "$HF_TOKEN" || { echo "Missing HF_TOKEN required for speaker diarization"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install FFmpeg and CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0+cpu torchaudio==2.8.0+cpu torchvision==0.23.0+cpu
          python -m pip install -r worker/requirements.txt
      - name: Process one queued v8.1 proof
        env:
          PYTHONPATH: worker
          AUDIO_TIMING_DATABASE_URL: ${{ secrets.V81_AUDIO_TIMING_DATABASE_URL }}
          AUDIO_TIMING_CLEANUP_URL: https://greektube-subs-git-preview-translation-pipeline-v-c31d25-ja-dam.vercel.app/api/audio-timing/upload
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WHISPER_MODEL: medium.en
          WHISPER_DEVICE: cpu
          WHISPER_COMPUTE_TYPE: int8
          WHISPER_BATCH_SIZE: "8"
        run: |
          python worker/scripts/run_queued_job.py
