name: temp-owner-full-lock
on:
  push:
    branches: [feature/generic-owner-translation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-owner-translation
      - name: Enforce owner lock and publish read-back
        run: |
          python - <<'PY'
          from pathlib import Path

          captions = Path('app/api/captions/route.ts')
          text = captions.read_text()
          old = 'import { getTranscriptStatus, TRANSCRIPT_VERSION } from "../shared-cache";'
          new = 'import { getTranscript, getTranscriptStatus, TRANSCRIPT_VERSION } from "../shared-cache";'
          assert text.count(old) == 1, f'captions import={text.count(old)}'
          text = text.replace(old, new)
          old = '''    if (videoId && await isOwnerChatgptVideo(videoId)) {\n      const status = await getTranscriptStatus(videoId);\n      if (status?.status === "processing") {\n        return NextResponse.json(ownerStatusPayload(status), {\n          status: 202,\n          headers: {\n            "Retry-After": "60",\n            "Cache-Control": "no-store",\n            "X-GreekTube-Translation-Mode": "owner-chatgpt",\n          },\n        });\n      }\n    }'''
          new = '''    if (videoId && await isOwnerChatgptVideo(videoId)) {\n      const status = await getTranscriptStatus(videoId);\n      const ownerHeaders = { "Cache-Control": "no-store", "X-GreekTube-Translation-Mode": "owner-chatgpt" };\n      if (status?.status === "processing") {\n        return NextResponse.json(ownerStatusPayload(status), { status: 202, headers: { ...ownerHeaders, "Retry-After": "60" } });\n      }\n      if (status?.status === "ready") {\n        const record = await getTranscript(videoId);\n        if (!record) return NextResponse.json({ error: "Owner transcript unavailable." }, { status: 409, headers: ownerHeaders });\n        return NextResponse.json({\n          status: "ready", progress: 100, videoId, title: record.title, channel: record.channel, duration: record.duration,\n          sourceLanguage: record.originalLanguage || "en", cues: record.greekTranscript, englishCues: record.englishTranscript,\n          keyPoints: record.keyPoints, topics: record.topics, transcriptVersion: record.transcriptVersion,\n          translationMode: "owner-chatgpt", translationMethod: "manual_chatgpt_pro_v1", cached: true,\n        }, { headers: ownerHeaders });\n      }\n      if (status?.status === "failed") {\n        return NextResponse.json({ status: "failed", progress: status.progress, videoId, error: "Owner-managed transcript is locked and requires admin action." }, { status: 409, headers: ownerHeaders });\n      }\n      return NextResponse.json({ status: "owner_locked", progress: 0, videoId, error: "Owner-managed transcript is locked and requires admin action." }, { status: 409, headers: ownerHeaders });\n    }'''
          assert text.count(old) == 1, f'owner guard={text.count(old)}'
          text = text.replace(old, new)
          captions.write_text(text)

          store = Path('app/api/owner-translation/store.ts')
          text = store.read_text()
          old = '''    if (!await completeTranscript(record, token)) throw new Error("Το guarded Neon switch απέτυχε.");\n    committed = true;\n\n    const db = database();'''
          new = '''    if (!await completeTranscript(record, token)) throw new Error("Το guarded Neon switch απέτυχε.");\n    committed = true;\n    const readBack = await getTranscript(videoId);\n    if (!readBack || readBack.status !== "ready" || readBack.englishTranscript.length !== manifest.cueCount || readBack.greekTranscript.length !== manifest.cueCount || ownerSourceHash(readBack.englishTranscript) !== manifest.sourceHash || ownerSourceHash(readBack.greekTranscript) !== manifest.greekDraftHash) {\n      throw new Error("Το production read-back δεν ταίριαξε με το validated owner manifest.");\n    }\n\n    const db = database();'''
          assert text.count(old) == 1, f'readback target={text.count(old)}'
          text = text.replace(old, new)
          store.write_text(text)

          Path('.github/workflows/temp-owner-full-lock.yml').unlink()
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/api/captions/route.ts app/api/owner-translation/store.ts .github/workflows/temp-owner-full-lock.yml
          git diff --cached --check
          git commit -m "Enforce owner lock across all caption states"
          git push origin HEAD:feature/generic-owner-translation
