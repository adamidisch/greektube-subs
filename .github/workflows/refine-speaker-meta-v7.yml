name: Refine speaker metadata v7
on:
  push:
    branches: [final-v7]
    paths:
      - scripts/refine-speaker-meta-v7.py
      - .github/workflows/refine-speaker-meta-v7.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-v7
      - run: python scripts/refine-speaker-meta-v7.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx app/content-areas-final.css
          git commit -m "Refine speaker profession and category presentation [v7-speaker-meta]"
          git push origin HEAD:final-v7
