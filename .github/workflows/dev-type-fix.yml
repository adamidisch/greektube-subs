name: One-time dev type fix

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[dev-type-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Narrow shared transcript before assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/GreekTubePlayer.tsx')
          text = path.read_text()
          old = 'if(!isCompleteGreekTranscript(sharedData,video.duration))throw new Error(failureMessage||"incomplete-transcript");'
          new = 'if(!sharedData||!isCompleteGreekTranscript(sharedData,video.duration))throw new Error(failureMessage||"incomplete-transcript");'
          if old not in text:
              raise SystemExit('Target line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx
          git commit -m "[dev-type-fix] Narrow shared transcript before assignment"
          git push origin HEAD:dev
