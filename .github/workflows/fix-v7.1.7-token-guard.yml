name: Fix v7.1.7 token guard

on:
  push:
    branches: [v7.1.7]
    paths:
      - .github/workflows/fix-v7.1.7-token-guard.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make unit mandatory in protected numeric tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/captions/route.ts')
          s=p.read_text()
          old=r'\d+(?:[.,]\d+)?\s*(?:mg|mcg|g|ml|IU|iu|%)?'
          new=r'\d+(?:[.,]\d+)?\s*(?:mg|mcg|g|ml|IU|iu|%)'
          if old not in s:
              raise SystemExit('token guard pattern missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/captions/route.ts
          git commit -m "GreekTube Subs 7.1.7: fix numeric token guard"
          git push origin HEAD:v7.1.7
