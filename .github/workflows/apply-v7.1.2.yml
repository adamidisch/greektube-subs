name: Apply v7.1.2 subtitle fixes

on:
  push:
    branches: [v7.1.2]
    paths:
      - '.github/workflows/apply-v7.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply v7.1.2 changes
        run: python3 scripts/apply-v7.1.2.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit v7.1.2
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app package.json package-lock.json
          git commit -m "GreekTube Subs 7.1.2: strict subtitle mapping and two-line readability"
          git push origin HEAD:v7.1.2
