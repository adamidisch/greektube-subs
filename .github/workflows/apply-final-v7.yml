name: Apply final v7
on:
  push:
    branches: [final-v7]
    paths:
      - scripts/apply_final_v7.py
      - .github/workflows/apply-final-v7.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-v7
      - run: python scripts/apply_final_v7.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx app/api/metadata/route.ts app/content-areas-final.css app/layout.tsx package.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "GreekTube Subs 7.0 final UX and library upgrade [v7-final]"
            git push origin HEAD:final-v7
          fi
