name: temp-owner-lease-compat
on:
  push:
    branches: [feature/generic-owner-translation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-owner-translation
      - name: Apply lease-only owner publish and legacy compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path('app/api/owner-translation/store.ts')
          text = store.read_text()
          text = text.replace('  acquireProcessingLock,\n', '')
          text = text.replace('  releaseProcessingLock,\n', '')
          assert text.count('async function claimFreezeLease(') == 1
          assert text.count('async function releaseFreezeLease(') == 1
          text = text.replace('claimFreezeLease', 'claimOwnerLease')
          text = text.replace('releaseFreezeLease', 'releaseOwnerLease')
          old = '  if (!await acquireProcessingLock(videoId, token, false)) throw new Error("Το βίντεο επεξεργάζεται ήδη. Το Publish δεν ξεκίνησε.");'
          new = '  if (!await claimOwnerLease(videoId, token)) throw new Error("Το βίντεο επεξεργάζεται ήδη. Το Publish δεν ξεκίνησε.");'
          assert text.count(old) == 1, f'publish lease target={text.count(old)}'
          text = text.replace(old, new)
          old = '      await releaseProcessingLock(videoId, token).catch(() => undefined);'
          new = '      await releaseOwnerLease(videoId, token).catch(() => undefined);'
          assert text.count(old) == 1, f'publish release target={text.count(old)}'
          text = text.replace(old, new)
          store.write_text(text)

          route = Path('app/api/owner-translation/route.ts')
          text = route.read_text()
          old = 'import { verifyAdminSession } from "@/lib/admin-auth";'
          new = 'import { verifyAdminSession } from "@/lib/admin-auth";\nimport { isOwnerChatgptVideo } from "../captions/owner-mode";'
          assert text.count(old) == 1, f'route owner import={text.count(old)}'
          text = text.replace(old, new)
          old = '    const manifest = await getOwnerTranslationManifest(videoId);\n    return NextResponse.json({ manifest }, { headers: { "Cache-Control": "no-store" } });'
          new = '    const manifest = await getOwnerTranslationManifest(videoId);\n    const legacyOwner = !manifest && await isOwnerChatgptVideo(videoId);\n    return NextResponse.json({ manifest, legacyOwner }, { headers: { "Cache-Control": "no-store" } });'
          assert text.count(old) == 1, f'route legacy target={text.count(old)}'
          text = text.replace(old, new)
          route.write_text(text)

          panel = Path('app/OwnerTranslationPanel.tsx')
          text = panel.read_text()
          old = 'type ApiResult = { manifest?: Manifest | null; validation?: Validation; error?: string };'
          new = 'type ApiResult = { manifest?: Manifest | null; validation?: Validation; legacyOwner?: boolean; error?: string };'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '  const [manifest, setManifest] = useState<Manifest | null>(null);\n  const [loading, setLoading] = useState(true);'
          new = '  const [manifest, setManifest] = useState<Manifest | null>(null);\n  const [legacyOwner, setLegacyOwner] = useState(false);\n  const [loading, setLoading] = useState(true);'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '      setManifest(result.manifest || null);\n      setValidation(result.manifest?.validation || null);'
          new = '      setManifest(result.manifest || null);\n      setLegacyOwner(Boolean(result.legacyOwner));\n      setValidation(result.manifest?.validation || null);'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '  const statusLabel = !manifest ? "AUTOMATIC" : manifest.status === "frozen" ? "OWNER · SOURCE FROZEN" : manifest.status === "validated" ? "OWNER · VALIDATED" : "OWNER · PUBLISHED";'
          new = '  const statusLabel = !manifest ? (legacyOwner ? "OWNER · LEGACY" : "AUTOMATIC") : manifest.status === "frozen" ? "OWNER · SOURCE FROZEN" : manifest.status === "validated" ? "OWNER · VALIDATED" : "OWNER · PUBLISHED";'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '<p>Κλείδωσε το τρέχον αγγλικό transcript ως immutable source πριν ξεκινήσει manual μετάφραση.</p>'
          new = '<p>{legacyOwner ? "Υπάρχει legacy owner lock. Κάνε Freeze Source για να μεταφερθεί στο νέο immutable manifest." : "Κλείδωσε το τρέχον αγγλικό transcript ως immutable source πριν ξεκινήσει manual μετάφραση."}</p>'
          assert text.count(old) == 1
          text = text.replace(old, new)
          panel.write_text(text)

          Path('.github/workflows/temp-owner-lease-compat.yml').unlink()
          PY
      - name: Commit patch and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/api/owner-translation/store.ts app/api/owner-translation/route.ts app/OwnerTranslationPanel.tsx .github/workflows/temp-owner-lease-compat.yml
          git diff --cached --check
          git commit -m "Use lease-only owner publish and preserve legacy state"
          git push origin HEAD:feature/generic-owner-translation
