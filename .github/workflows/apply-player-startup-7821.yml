name: apply-player-startup-7821

on:
  push:
    branches:
      - perf/player-startup-7821
    paths:
      - scripts/apply_player_startup_7821.py
      - .github/workflows/apply-player-startup-7821.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/player-startup-7821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply guarded migration
        run: python scripts/apply_player_startup_7821.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Remove one-time migration files
        run: rm -f scripts/apply_player_startup_7821.py .github/workflows/apply-player-startup-7821.yml
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: faster player startup and compact settings"
          git push origin HEAD:perf/player-startup-7821
