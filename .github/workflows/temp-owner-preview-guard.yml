name: temp-owner-preview-guard
on:
  push:
    branches: [feature/owner-publishing-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-publishing-recovery
      - name: Block owner mutations in preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/owner-translation/store.ts')
          text = p.read_text()

          marker = '''function normalizeText(value: unknown) {'''
          insert = '''function assertOwnerMutationEnvironment() {\n  if (process.env.VERCEL_ENV === "preview") {\n    throw new Error("Owner translation mutations είναι απενεργοποιημένα στα Preview deployments μέχρι να υπάρχουν αποδεδειγμένα ξεχωριστά Neon και Blob resources.");\n  }\n}\n\nfunction normalizeText(value: unknown) {'''
          assert text.count(marker) == 1
          text = text.replace(marker, insert)

          old = '''export async function freezeOwnerSource(videoId: string, newRevision = false) {\n  await ensureOwnerTranslationTable();'''
          new = '''export async function freezeOwnerSource(videoId: string, newRevision = false) {\n  assertOwnerMutationEnvironment();\n  await ensureOwnerTranslationTable();'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''export async function validateOwnerGreek(videoId: string, subtitleText: string) {\n  if (subtitleText.length > 2_000_000)'''
          new = '''export async function validateOwnerGreek(videoId: string, subtitleText: string) {\n  assertOwnerMutationEnvironment();\n  if (subtitleText.length > 2_000_000)'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''export async function reconcileOwnerPublishing(videoId: string) {\n  const manifest = await getOwnerTranslationManifest(videoId);\n  if (!manifest || manifest.status !== "publishing") return manifest;'''
          new = '''export async function reconcileOwnerPublishing(videoId: string) {\n  const manifest = await getOwnerTranslationManifest(videoId);\n  if (!manifest || manifest.status !== "publishing") return manifest;\n  if (process.env.VERCEL_ENV === "preview") return manifest;'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''export async function publishOwnerTranslation(videoId: string) {\n  let manifest = await getOwnerTranslationManifest(videoId);'''
          new = '''export async function publishOwnerTranslation(videoId: string) {\n  assertOwnerMutationEnvironment();\n  let manifest = await getOwnerTranslationManifest(videoId);'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          p.write_text(text)

          Path('.github/workflows/temp-owner-preview-guard.yml').unlink()
          PY
      - name: Commit preview guard and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/api/owner-translation/store.ts .github/workflows/temp-owner-preview-guard.yml
          git diff --cached --check
          git commit -m "Block owner mutations in preview"
          git push origin HEAD:feature/owner-publishing-recovery
