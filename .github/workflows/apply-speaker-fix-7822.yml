name: apply-speaker-fix-7822

on:
  push:
    branches:
      - fix/canonical-speakers-7822
    paths:
      - scripts/apply_speaker_fix_7822.py
      - .github/workflows/apply-speaker-fix-7822.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-speakers-7822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply guarded speaker migration
        run: python scripts/apply_speaker_fix_7822.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Production build
        run: npm run build
      - name: Remove one-time migration files
        run: rm -f scripts/apply_speaker_fix_7822.py .github/workflows/apply-speaker-fix-7822.yml
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx app/api/metadata/route.ts app/api/captions/route.ts app/api/state/route.ts app/speaker-catalog.ts package.json
          git add -u scripts/apply_speaker_fix_7822.py .github/workflows/apply-speaker-fix-7822.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: canonical speaker names across library and ingestion"
          git push origin HEAD:fix/canonical-speakers-7822
