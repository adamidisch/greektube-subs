name: One-time State Type Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow state type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/state/route.ts')
          s = p.read_text()
          old = 'type VideoRecord = Record<string, unknown> & { id?: unknown };'
          new = 'type VideoRecord = Record<string, unknown> & { id?: unknown; addedAt?: unknown };'
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "adamidisch"
          git config user.email "136883594+adamidisch@users.noreply.github.com"
          git add app/api/state/route.ts
          git commit -m "Fix state video record typing for Next.js"
          git push
