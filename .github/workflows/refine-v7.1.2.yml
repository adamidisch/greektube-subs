name: Refine v7.1.2 subtitle timing

on:
  push:
    branches: [v7.1.2]
    paths:
      - '.github/workflows/refine-v7.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply overlap-aware timing refinement
        run: python3 scripts/refine-v7.1.2-timing.py
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx app/api/captions/route.ts
          git commit -m "GreekTube Subs 7.1.2: overlap-aware subtitle timing"
          git push origin HEAD:v7.1.2
