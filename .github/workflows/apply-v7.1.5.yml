name: Apply v7.1.5 stability fixes

on:
  push:
    branches: [v7.1.5]
    paths:
      - scripts/apply-v7.1.5.py
      - .github/workflows/apply-v7.1.5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v7.1.5 changes
        run: python scripts/apply-v7.1.5.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify release consistency
        run: |
          grep -q '"version": "7.1.5"' package.json
          grep -q 'data.transcriptVersion!==8' app/GreekTubePlayer.tsx
          ! grep -R 'data.transcriptVersion!==7' app
          grep -q 'TRANSCRIPT_VERSION = 8' app/api/shared-cache.ts
          grep -q 'greektube-transcript:${video.id}:v8' app/GreekTubePlayer.tsx
      - name: Commit v7.1.5
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app package.json
          git diff --cached --quiet && exit 0
          git commit -m "GreekTube Subs 7.1.5: bounded fidelity checks and stability fixes"
          git push origin HEAD:v7.1.5
