name: Apply v7.1.4 fidelity and UI pass

on:
  push:
    branches: [v7.1.4]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply v7.1.4 changes
        run: python scripts/apply-v7.1.4.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify release markers
        run: |
          grep -q '"version": "7.1.4"' package.json
          grep -q 'ver 7.1.4' app/GreekTubePlayer.tsx
          grep -q 'TRANSCRIPT_VERSION = 8' app/api/shared-cache.ts
          grep -q 'greektube-transcript:${video.id}:v8' app/GreekTubePlayer.tsx
      - name: Commit v7.1.4
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app package.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "GreekTube Subs 7.1.4: fidelity verification and UI restoration"
            git push origin HEAD:v7.1.4
          fi
