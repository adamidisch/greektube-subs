name: Apply UI 6.5.1

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: python apply_ui_651.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx app/layout.tsx app/mobile-controls-fix.css app/ui-651.css package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[ui-651] Refine full UI as 6.5.1 DEV"
          git push origin HEAD:dev
