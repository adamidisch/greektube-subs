name: temp-wire-generic-owner
on:
  push:
    branches: [feature/generic-owner-translation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-owner-translation
      - name: Apply exact owner translation wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path('app/api/owner-translation/store.ts')
          text = store.read_text()
          old = '''  getTranscript,\n  readTranscriptCheckpoint,\n  releaseProcessingLock,'''
          new = '''  getTranscript,\n  releaseProcessingLock,'''
          assert text.count(old) == 1, f'store import target count={text.count(old)}'
          text = text.replace(old, new)
          old2 = 'import { publishTranscript, publishTranscriptCheckpoint, readPublishedTranscript } from "../transcript-blob";'
          new2 = 'import { publishTranscript, publishTranscriptCheckpoint, readPublishedTranscript, readTranscriptCheckpoint } from "../transcript-blob";'
          assert text.count(old2) == 1, f'transcript import target count={text.count(old2)}'
          text = text.replace(old2, new2)
          old3 = '''  const now = new Date().toISOString();\n  try {'''
          new3 = '''  const now = new Date().toISOString();\n  let committed = false;\n  try {'''
          assert text.count(old3) == 1, f'commit flag target count={text.count(old3)}'
          text = text.replace(old3, new3)
          old4 = '''    if (!await completeTranscript(record, token)) throw new Error("Το guarded Neon switch απέτυχε.");\n\n    const db = database();'''
          new4 = '''    if (!await completeTranscript(record, token)) throw new Error("Το guarded Neon switch απέτυχε.");\n    committed = true;\n\n    const db = database();'''
          assert text.count(old4) == 1, f'commit set target count={text.count(old4)}'
          text = text.replace(old4, new4)
          old5 = '''  } catch (error) {\n    if (previousPublished) await publishTranscript(videoId, TRANSCRIPT_VERSION, previousPublished).catch(() => undefined);\n    if (previousCheckpoint) await publishTranscriptCheckpoint(videoId, TRANSCRIPT_VERSION, previousCheckpoint).catch(() => undefined);\n    await releaseProcessingLock(videoId, token).catch(() => undefined);\n    throw error;\n  }'''
          new5 = '''  } catch (error) {\n    if (!committed) {\n      if (previousPublished) await publishTranscript(videoId, TRANSCRIPT_VERSION, previousPublished).catch(() => undefined);\n      if (previousCheckpoint) await publishTranscriptCheckpoint(videoId, TRANSCRIPT_VERSION, previousCheckpoint).catch(() => undefined);\n      await releaseProcessingLock(videoId, token).catch(() => undefined);\n    }\n    throw error;\n  }'''
          assert text.count(old5) == 1, f'rollback target count={text.count(old5)}'
          text = text.replace(old5, new5)
          store.write_text(text)

          editor = Path('app/VideoEditorDemoEnhancer.tsx')
          text = editor.read_text()
          old = 'import {createPortal} from "react-dom";'
          new = 'import {createPortal} from "react-dom";\nimport OwnerTranslationPanel from "./OwnerTranslationPanel";'
          assert text.count(old) == 1, f'editor import target count={text.count(old)}'
          text = text.replace(old, new)
          old = '''            </section>\n            <section className={`gts-editor-card gts-editor-validation ${validationErrors.length?"has-errors":"ok"}`}>'''
          new = '''            </section>\n            <OwnerTranslationPanel videoId={video.id}/>\n            <section className={`gts-editor-card gts-editor-validation ${validationErrors.length?"has-errors":"ok"}`}>'''
          assert text.count(old) == 1, f'editor panel target count={text.count(old)}'
          text = text.replace(old, new)
          editor.write_text(text)

          workflow = Path('.github/workflows/temp-wire-generic-owner.yml')
          workflow.unlink()
          PY
      - name: Commit patch and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/api/owner-translation/store.ts app/VideoEditorDemoEnhancer.tsx .github/workflows/temp-wire-generic-owner.yml
          git diff --cached --check
          git commit -m "Wire generic owner translation into editor"
          git push origin HEAD:feature/generic-owner-translation
