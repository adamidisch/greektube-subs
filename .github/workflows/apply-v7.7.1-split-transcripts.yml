name: Apply v7.7.1 split transcripts

on:
  push:
    branches: [phase2-split-transcripts-7.7.1]
    paths:
      - scripts/apply-v7.7.1-split-transcripts.py
      - app/api/transcript-blob.ts
      - .github/workflows/apply-v7.7.1-split-transcripts.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-split-transcripts-7.7.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded Phase 2 patch
        run: python scripts/apply-v7.7.1-split-transcripts.py
      - run: npm install --no-audit --no-fund
      - run: npm run test:caption-integrity
      - run: npm run test:caption-timing
      - run: npm run test:caption-edgecases
      - run: npm run test:manual-captions
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Verify split transcript invariants
        shell: bash
        run: |
          grep -q 'includeEnglish' app/api/captions/route.ts
          grep -q 'greekPathname' app/api/transcript-blob.ts
          grep -q 'englishPathname' app/api/transcript-blob.ts
          grep -q 'includeEnglish=1' app/GreekTubePlayer.tsx
          grep -q '"version": "7.7.1"' package.json
      - name: Commit verified v7.7.1 branch
        shell: bash
        run: |
          rm -f next-env.d.ts
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app package.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "GreekTube Subs 7.7.1: lazy-load English transcripts"
          git push origin HEAD:phase2-split-transcripts-7.7.1
