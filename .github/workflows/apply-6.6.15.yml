name: Apply GreekTube 6.6.15 patch

on:
  push:
    branches:
      - apply-6.6.15-patch
    paths:
      - scripts/apply-6.6.15-tsx.py
      - .github/workflows/apply-6.6.15.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[6.6.15-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: apply-6.6.15-patch
          fetch-depth: 0

      - name: Apply reviewed TSX patch
        run: python scripts/apply-6.6.15-tsx.py

      - name: Remove one-shot patch helpers
        run: rm -f scripts/apply-6.6.15-tsx.py .github/workflows/apply-6.6.15.yml

      - name: Commit patched release
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply Claude 6.6.15 patch [6.6.15-applied]"
          git push origin HEAD:apply-6.6.15-patch
