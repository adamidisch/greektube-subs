name: One-time Player Type Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/GreekTubePlayer.tsx')
          s = p.read_text()
          old = 'if(!isCompleteGreekTranscript(sharedData,video.duration))throw new Error(failureMessage||"incomplete-transcript");\n        data=sharedData;'
          new = 'if(!sharedData||!isCompleteGreekTranscript(sharedData,video.duration))throw new Error(failureMessage||"incomplete-transcript");\n        data=sharedData;'
          if old not in s:
              print('Target already fixed or not found')
          else:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "adamidisch"
          git config user.email "136883594+adamidisch@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx
          git commit -m "Fix caption nullability for Next.js typecheck"
          git push
