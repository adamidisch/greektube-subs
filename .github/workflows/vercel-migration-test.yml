name: Validate Vercel migration

on:
  push:
    branches:
      - vercel-migration-test

permissions:
  contents: write

jobs:
  migrate-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Vercel migration files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .migration/vercel-files.b64 > /tmp/vercel-files.tgz
          tar -xzf /tmp/vercel-files.tgz
      - name: Apply native Next.js compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          player = Path('app/GreekTubePlayer.tsx')
          text = player.read_text()
          old = 'function isCompleteGreekTranscript(data:Captions|null|undefined,duration=0) {'
          new = 'function isCompleteGreekTranscript(data:Captions|null|undefined,duration=0): data is Captions {'
          if old not in text:
              raise SystemExit('Expected type-narrowing function signature not found')
          player.write_text(text.replace(old, new, 1))

          state = Path('app/api/state/route.ts')
          text = state.read_text()
          old = '}).sort((a, b) => String(b.addedAt || "").localeCompare(String(a.addedAt || "")));'
          new = '}).sort((a: VideoRecord, b: VideoRecord) => String(b.addedAt || "").localeCompare(String(a.addedAt || "")));'
          if old not in text:
              raise SystemExit('Expected state sort expression not found')
          state.write_text(text.replace(old, new, 1))

          db = Path('db/index.ts')
          text = db.read_text()
          text = text.replace(
              'sql(postgresPlaceholders(query), params as any[])',
              'sql.query(postgresPlaceholders(query), params as any[])',
          )
          text = text.replace(
              'sql(postgresPlaceholders(query), params as any[], { fullResults: true })',
              'sql.query(postgresPlaceholders(query), params as any[], { fullResults: true })',
          )
          if 'await sql(' in text:
              raise SystemExit('Dynamic Neon SQL call still uses tagged-template function signature')
          db.write_text(text)
          PY
      - name: Install dependencies
        run: npm install
      - name: Build native Next.js app
        run: npm run build
      - name: Commit validated migration files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/**' ':!.migration/**'
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Validate native Vercel migration"
            git push origin HEAD:vercel-migration-test
          fi
