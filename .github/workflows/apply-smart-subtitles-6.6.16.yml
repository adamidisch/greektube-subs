name: Apply smart subtitle cleanup 6.6.16

on:
  push:
    branches:
      - smart-subtitles-6.6.16
    paths:
      - scripts/apply-smart-subtitles-6.6.16.py
      - .github/workflows/apply-smart-subtitles-6.6.16.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[smart-subtitles-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: smart-subtitles-6.6.16
          fetch-depth: 0

      - name: Apply subtitle cleanup
        run: python scripts/apply-smart-subtitles-6.6.16.py

      - name: Build
        run: npm ci && npm run build

      - name: Remove one-shot helpers
        run: rm -f scripts/apply-smart-subtitles-6.6.16.py .github/workflows/apply-smart-subtitles-6.6.16.yml

      - name: Commit reviewed subtitle cleanup
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean ASR fillers before and after Greek translation [smart-subtitles-applied]"
          git push origin HEAD:smart-subtitles-6.6.16
