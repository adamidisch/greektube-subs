name: Apply version 6.5.3
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/apply_version_653.py'
      - '.github/workflows/apply-version-653.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: python scripts/apply_version_653.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx
          git diff --cached --quiet || git commit -m "[ui-653] Set visible version to 6.5.3 DEV"
          git push origin dev
