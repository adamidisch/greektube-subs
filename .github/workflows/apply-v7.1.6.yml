name: Apply v7.1.6 subtitle pipeline

on:
  push:
    branches: [v7.1.6]
    paths:
      - scripts/apply-v7.1.6.py
      - .github/workflows/apply-v7.1.6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v7.1.6 changes
        run: python scripts/apply-v7.1.6.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify subtitle architecture
        run: |
          grep -q '"version": "7.1.6"' package.json
          grep -q 'TRANSCRIPT_VERSION = 9' app/api/shared-cache.ts
          grep -q 'data.transcriptVersion!==9' app/GreekTubePlayer.tsx
          grep -q 'greektube-transcript:${video.id}:v9' app/GreekTubePlayer.tsx
          grep -q 'sentence_faithful_v6' app/api/captions/route.ts
          grep -q 'statusResponse.status!==202' app/GreekTubePlayer.tsx
          ! grep -R 'data.transcriptVersion!==8' app
      - name: Commit v7.1.6
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app package.json
          git diff --cached --quiet && exit 0
          git commit -m "GreekTube Subs 7.1.6: sentence-faithful translation and live progress"
          git push origin HEAD:v7.1.6
