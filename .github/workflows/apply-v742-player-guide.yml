name: Apply v7.4.2 player guide redesign

on:
  push:
    branches: [tmp-v742-player-guide-redesign]
    paths:
      - '.github/workflows/apply-v742-player-guide.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.4.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Fetch reviewed patch script
        run: |
          git show origin/tmp-v742-player-guide-redesign:scripts/apply-v742-player-guide-redesign.py > /tmp/apply-v742.py
      - name: Apply editorial guide and player redesign
        run: python /tmp/apply-v742.py
      - name: Install dependencies
        run: npm ci
      - name: Caption integrity
        run: npm run test:caption-integrity
      - name: Caption timing
        run: npm run test:caption-timing
      - name: Caption edge cases
        run: npm run test:caption-edgecases
      - name: Manual captions
        run: npm run test:manual-captions
      - name: v7.4.1 quality tests
        run: node scripts/v741-quality-reliability.test.mjs
      - name: v7.4.2 player guide invariants
        run: node scripts/v742-player-guide.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated v7.4.2
        run: |
          git config user.name 'GreekTube Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/GreekTubePlayer.tsx app/layout.tsx app/v7-4-2.css package.json package-lock.json scripts/v742-player-guide.test.mjs
          git commit -m 'GreekTube Subs 7.4.2: editorial video guide and player polish'
          git push origin HEAD:v7.4.2
