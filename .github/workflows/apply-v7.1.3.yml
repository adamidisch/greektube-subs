name: Apply v7.1.3 semantic boundary pipeline

on:
  push:
    branches: [v7.1.3]
    paths:
      - '.github/workflows/apply-v7.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v7.1.3 changes
        run: python3 scripts/apply-v7.1.3-semantic-boundaries.py
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify release markers
        run: |
          grep -q '"version": "7.1.3"' package.json
          grep -q 'TRANSCRIPT_VERSION = 7' app/api/shared-cache.ts
          ! grep -R ':v6\|transcriptVersion!==6\|TRANSCRIPT_VERSION = 6' app/GreekTubePlayer.tsx app/api/shared-cache.ts
      - name: Commit v7.1.3
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx app/api/captions/route.ts app/api/shared-cache.ts app/layout.tsx package.json
          git commit -m "GreekTube Subs 7.1.3: semantic subtitle boundaries"
          git push origin HEAD:v7.1.3
