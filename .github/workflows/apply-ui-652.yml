name: Apply UI 6.5.2
on:
  push:
    branches: [dev]
    paths:
      - scripts/apply_ui_652.py
      - .github/workflows/apply-ui-652.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: python scripts/apply_ui_652.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/GreekTubePlayer.tsx app/layout.tsx app/ui-651.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "[ui-652] Remove timer and speed; center mobile controls"
            git push origin HEAD:dev
          fi
