name: temp-owner-publishing-hardening
on:
  push:
    branches: [feature/owner-publishing-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-publishing-recovery
      - name: Apply owner publishing recovery hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/api/owner-translation/store.ts')
          text = p.read_text()

          old = 'export type OwnerTranslationStatus = "frozen" | "validated" | "published";'
          new = 'export type OwnerTranslationStatus = "frozen" | "validated" | "publishing" | "published";'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''export function ensureOwnerTranslationTable() {\n  if (ownerTableReady) return ownerTableReady;\n  ownerTableReady = (async () => {\n    const db = database();\n    await db.query(`CREATE TABLE IF NOT EXISTS owner_translation_manifests (\n      video_id TEXT NOT NULL,\n      revision INTEGER NOT NULL,\n      transcript_version INTEGER NOT NULL,\n      cue_count INTEGER NOT NULL,\n      source_hash TEXT NOT NULL,\n      timestamp_hash TEXT NOT NULL,\n      source_blob_path TEXT NOT NULL,\n      greek_draft_blob_path TEXT,\n      greek_draft_hash TEXT,\n      status TEXT NOT NULL DEFAULT 'frozen',\n      translation_mode TEXT NOT NULL DEFAULT 'owner',\n      translation_method TEXT NOT NULL DEFAULT 'manual_chatgpt_pro_v1',\n      validation_json TEXT,\n      owner_locked_at TEXT NOT NULL,\n      validated_at TEXT,\n      published_at TEXT,\n      created_at TEXT NOT NULL,\n      updated_at TEXT NOT NULL,\n      PRIMARY KEY (video_id, revision)\n    )`);\n    await db.query("CREATE INDEX IF NOT EXISTS owner_translation_video_status_idx ON owner_translation_manifests (video_id, status, revision DESC)");\n  })().catch((error: unknown) => {\n    ownerTableReady = null;\n    throw error;\n  });\n  return ownerTableReady;\n}'''
          new = '''export function ensureOwnerTranslationTable() {\n  if (ownerTableReady) return ownerTableReady;\n  ownerTableReady = (async () => {\n    const db = database();\n    await db.query("SELECT 1 FROM owner_translation_manifests LIMIT 1");\n  })().catch((error: unknown) => {\n    ownerTableReady = null;\n    throw error;\n  });\n  return ownerTableReady;\n}'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''  const existingManifest = await getOwnerTranslationManifest(videoId);\n  if (existingManifest && !newRevision) return { manifest: existingManifest, created: false };'''
          new = '''  const existingManifest = await getOwnerTranslationManifest(videoId);\n  if (existingManifest && !newRevision) return { manifest: existingManifest, created: false };\n  if (existingManifest?.status === "publishing") throw new Error("Η προηγούμενη owner revision είναι ακόμη σε publishing/recovery.");'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''  if (!manifest) throw new Error("Κάνε πρώτα Freeze Source.");\n  if (manifest.status === "published") throw new Error("Αυτή η owner revision έχει ήδη δημοσιευτεί.");'''
          new = '''  if (!manifest) throw new Error("Κάνε πρώτα Freeze Source.");\n  if (manifest.status === "published") throw new Error("Αυτή η owner revision έχει ήδη δημοσιευτεί.");\n  if (manifest.status === "publishing") throw new Error("Η owner revision είναι σε publishing/recovery. Περίμενε να ολοκληρωθεί το reconcile.");'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = "WHERE video_id=$5 AND revision=$6 AND source_hash=$7 AND status!='published' RETURNING video_id"
          new = "WHERE video_id=$5 AND revision=$6 AND source_hash=$7 AND status IN ('frozen','validated') RETURNING video_id"
          assert text.count(old) == 1
          text = text.replace(old, new)

          marker = '''  return normalized;\n}\n\nexport async function publishOwnerTranslation(videoId: string) {'''
          insert = '''  return normalized;\n}\n\nasync function transcriptMatchesOwnerManifest(manifest: OwnerTranslationManifest) {\n  const readBack = await getTranscript(manifest.videoId);\n  return Boolean(readBack &&\n    readBack.status === "ready" &&\n    readBack.englishTranscript.length === manifest.cueCount &&\n    readBack.greekTranscript.length === manifest.cueCount &&\n    ownerSourceHash(readBack.englishTranscript) === manifest.sourceHash &&\n    Boolean(manifest.greekDraftHash) &&\n    ownerSourceHash(readBack.greekTranscript) === manifest.greekDraftHash);\n}\n\nexport async function reconcileOwnerPublishing(videoId: string) {\n  const manifest = await getOwnerTranslationManifest(videoId);\n  if (!manifest || manifest.status !== "publishing") return manifest;\n  const db = database();\n  const now = new Date().toISOString();\n  if (await transcriptMatchesOwnerManifest(manifest)) {\n    const rows = await db.query(\n      `UPDATE owner_translation_manifests SET status='published',published_at=COALESCE(published_at,$1),updated_at=$1\n       WHERE video_id=$2 AND revision=$3 AND source_hash=$4 AND status='publishing' RETURNING video_id`,\n      [now, videoId, manifest.revision, manifest.sourceHash],\n    ) as { video_id: string }[];\n    if (rows.length !== 1) throw new Error("Το publishing reconcile δεν μπόρεσε να ολοκληρώσει το manifest.");\n  } else {\n    const rows = await db.query(\n      `UPDATE owner_translation_manifests SET status='validated',updated_at=$1\n       WHERE video_id=$2 AND revision=$3 AND source_hash=$4 AND status='publishing' RETURNING video_id`,\n      [now, videoId, manifest.revision, manifest.sourceHash],\n    ) as { video_id: string }[];\n    if (rows.length !== 1) throw new Error("Το publishing reconcile δεν μπόρεσε να επαναφέρει το manifest σε validated.");\n  }\n  return await getOwnerTranslationManifest(videoId);\n}\n\nexport async function publishOwnerTranslation(videoId: string) {'''
          assert text.count(marker) == 1
          text = text.replace(marker, insert)

          start = text.index('export async function publishOwnerTranslation(videoId: string) {')
          old_publish = text[start:]
          new_publish = '''export async function publishOwnerTranslation(videoId: string) {\n  let manifest = await getOwnerTranslationManifest(videoId);\n  if (!manifest) throw new Error("Δεν υπάρχει owner manifest.");\n  if (manifest.status === "published") return { manifest, alreadyPublished: true };\n  if (manifest.status === "publishing") {\n    manifest = await reconcileOwnerPublishing(videoId);\n    if (!manifest) throw new Error("Το owner manifest χάθηκε κατά το reconcile.");\n    if (manifest.status === "published") return { manifest, alreadyPublished: true };\n  }\n  if (manifest.status !== "validated" || !manifest.validation?.ok) throw new Error("Η μετάφραση πρέπει πρώτα να περάσει Validate.");\n\n  const english = await readSource(manifest);\n  const greek = await readDraft(manifest);\n  const existing = await getTranscript(videoId);\n  if (!existing) throw new Error("Το transcript record δεν υπάρχει.");\n\n  const token = crypto.randomUUID();\n  if (!await claimOwnerLease(videoId, token)) throw new Error("Το βίντεο επεξεργάζεται ήδη. Το Publish δεν ξεκίνησε.");\n\n  const db = database();\n  const publishingAt = new Date().toISOString();\n  const publishingRows = await db.query(\n    `UPDATE owner_translation_manifests SET status='publishing',updated_at=$1\n     WHERE video_id=$2 AND revision=$3 AND source_hash=$4 AND status='validated' RETURNING video_id`,\n    [publishingAt, videoId, manifest.revision, manifest.sourceHash],\n  ) as { video_id: string }[];\n  if (publishingRows.length !== 1) {\n    await releaseOwnerLease(videoId, token).catch(() => undefined);\n    throw new Error("Το owner manifest δεν μπόρεσε να περάσει σε publishing.");\n  }\n\n  const previousPublished = await readPublishedTranscript(videoId, TRANSCRIPT_VERSION, true).catch(() => null);\n  const previousCheckpoint = await readTranscriptCheckpoint(videoId, TRANSCRIPT_VERSION, true).catch(() => null);\n  const now = new Date().toISOString();\n  let committed = false;\n  try {\n    const duration = greek.reduce((max, cue) => Math.max(max, cue.start + cue.duration), existing.duration || 0);\n    const finalPayload = {\n      status: "ready",\n      progress: 100,\n      videoId,\n      title: existing.title,\n      channel: existing.channel,\n      duration,\n      transcriptVersion: TRANSCRIPT_VERSION,\n      cues: greek,\n      englishCues: english,\n    };\n    if (!await publishTranscript(videoId, TRANSCRIPT_VERSION, finalPayload)) throw new Error("Η εγγραφή των final Blob artifacts απέτυχε.");\n\n    const record: TranscriptRecord = {\n      ...existing,\n      duration,\n      rawEnglishTranscript: existing.rawEnglishTranscript.length ? existing.rawEnglishTranscript : english,\n      englishTranscript: english,\n      greekTranscript: greek,\n      timestamps: greek.map(cue => ({ start: cue.start, duration: cue.duration })),\n      status: "ready",\n      progress: 100,\n      transcriptVersion: TRANSCRIPT_VERSION,\n      error: null,\n      processingStage: null,\n      processingCursor: 0,\n      retryCount: 0,\n      retryAfter: null,\n      updatedAt: now,\n    };\n    if (!await completeTranscript(record, token)) throw new Error("Το guarded Neon switch απέτυχε.");\n    committed = true;\n    if (!await transcriptMatchesOwnerManifest(manifest)) {\n      throw new Error("Το production read-back δεν ταίριαξε με το validated owner manifest. Το manifest έμεινε σε publishing για recovery.");\n    }\n\n    const publishedRows = await db.query(\n      `UPDATE owner_translation_manifests SET status='published',published_at=$1,updated_at=$1\n       WHERE video_id=$2 AND revision=$3 AND source_hash=$4 AND status='publishing' RETURNING video_id`,\n      [now, videoId, manifest.revision, manifest.sourceHash],\n    ) as { video_id: string }[];\n    if (publishedRows.length !== 1) throw new Error("Το final owner manifest transition δεν ολοκληρώθηκε. Το manifest έμεινε σε publishing για recovery.");\n    const updated = await getOwnerTranslationManifest(videoId);\n    if (!updated || updated.revision !== manifest.revision || updated.status !== "published") throw new Error("Το published owner manifest δεν επιβεβαιώθηκε.");\n    return { manifest: updated, alreadyPublished: false };\n  } catch (error) {\n    if (!committed) {\n      if (previousPublished) await publishTranscript(videoId, TRANSCRIPT_VERSION, previousPublished).catch(() => undefined);\n      if (previousCheckpoint) await publishTranscriptCheckpoint(videoId, TRANSCRIPT_VERSION, previousCheckpoint).catch(() => undefined);\n      await db.query(\n        `UPDATE owner_translation_manifests SET status='validated',updated_at=$1\n         WHERE video_id=$2 AND revision=$3 AND source_hash=$4 AND status='publishing'`,\n        [new Date().toISOString(), videoId, manifest.revision, manifest.sourceHash],\n      ).catch(() => undefined);\n      await releaseOwnerLease(videoId, token).catch(() => undefined);\n    }\n    throw error;\n  }\n}\n'''
          text = text[:start] + new_publish
          p.write_text(text)

          p = Path('app/api/owner-translation/route.ts')
          text = p.read_text()
          old = '''  ownerTranslationPackage,\n  publishOwnerTranslation,\n  validateOwnerGreek,'''
          new = '''  ownerTranslationPackage,\n  publishOwnerTranslation,\n  reconcileOwnerPublishing,\n  validateOwnerGreek,'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''    const manifest = await getOwnerTranslationManifest(videoId);\n    const legacyOwner = !manifest && await isOwnerChatgptVideo(videoId);'''
          new = '''    let manifest = await getOwnerTranslationManifest(videoId);\n    if (manifest?.status === "publishing") manifest = await reconcileOwnerPublishing(videoId);\n    const legacyOwner = !manifest && await isOwnerChatgptVideo(videoId);'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          p.write_text(text)

          p = Path('app/OwnerTranslationPanel.tsx')
          text = p.read_text()
          old = '  status: "frozen" | "validated" | "published";'
          new = '  status: "frozen" | "validated" | "publishing" | "published";'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''  const statusLabel = !manifest ? (legacyOwner ? "OWNER · LEGACY" : "AUTOMATIC") : manifest.status === "frozen" ? "OWNER · SOURCE FROZEN" : manifest.status === "validated" ? "OWNER · VALIDATED" : "OWNER · PUBLISHED";\n  const canValidate = Boolean(manifest && manifest.status !== "published");'''
          new = '''  const statusLabel = !manifest ? (legacyOwner ? "OWNER · LEGACY" : "AUTOMATIC") : manifest.status === "frozen" ? "OWNER · SOURCE FROZEN" : manifest.status === "validated" ? "OWNER · VALIDATED" : manifest.status === "publishing" ? "OWNER · PUBLISHING" : "OWNER · PUBLISHED";\n  const canValidate = Boolean(manifest && (manifest.status === "frozen" || manifest.status === "validated"));'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '.gts-owner-head>strong.state-frozen{color:#d7bd7d;background:rgba(183,139,65,.12)}.gts-owner-head>strong.state-validated{color:#94d6ae;background:rgba(74,155,107,.13)}.gts-owner-head>strong.state-published{color:#a99ef5;background:rgba(117,105,217,.15)}'
          new = '.gts-owner-head>strong.state-frozen{color:#d7bd7d;background:rgba(183,139,65,.12)}.gts-owner-head>strong.state-validated{color:#94d6ae;background:rgba(74,155,107,.13)}.gts-owner-head>strong.state-publishing{color:#e2c47e;background:rgba(189,146,67,.14)}.gts-owner-head>strong.state-published{color:#a99ef5;background:rgba(117,105,217,.15)}'
          assert text.count(old) == 1
          text = text.replace(old, new)
          p.write_text(text)

          migration = Path('db/migrations/20260822_owner_translation_manifests.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Explicit additive migration for the generic owner translation workflow.\nCREATE TABLE IF NOT EXISTS owner_translation_manifests (\n  video_id TEXT NOT NULL,\n  revision INTEGER NOT NULL,\n  transcript_version INTEGER NOT NULL,\n  cue_count INTEGER NOT NULL,\n  source_hash TEXT NOT NULL,\n  timestamp_hash TEXT NOT NULL,\n  source_blob_path TEXT NOT NULL,\n  greek_draft_blob_path TEXT,\n  greek_draft_hash TEXT,\n  status TEXT NOT NULL DEFAULT 'frozen',\n  translation_mode TEXT NOT NULL DEFAULT 'owner',\n  translation_method TEXT NOT NULL DEFAULT 'manual_chatgpt_pro_v1',\n  validation_json TEXT,\n  owner_locked_at TEXT NOT NULL,\n  validated_at TEXT,\n  published_at TEXT,\n  created_at TEXT NOT NULL,\n  updated_at TEXT NOT NULL,\n  PRIMARY KEY (video_id, revision)\n);\n\nCREATE INDEX IF NOT EXISTS owner_translation_video_status_idx\n  ON owner_translation_manifests (video_id, status, revision DESC);\n''')

          Path('.github/workflows/temp-owner-publishing-hardening.yml').unlink()
          PY
      - name: Commit hardening and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/api/owner-translation/store.ts app/api/owner-translation/route.ts app/OwnerTranslationPanel.tsx db/migrations/20260822_owner_translation_manifests.sql .github/workflows/temp-owner-publishing-hardening.yml
          git diff --cached --check
          git commit -m "Harden owner publishing recovery"
          git push origin HEAD:feature/owner-publishing-recovery
