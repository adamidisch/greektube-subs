name: temp-owner-reconcile-race
on:
  push:
    branches: [feature/owner-publishing-recovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-publishing-recovery
      - name: Guard publishing reconcile races
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/owner-translation/store.ts')
          text = p.read_text()
          old = '''export async function reconcileOwnerPublishing(videoId: string) {\n  const manifest = await getOwnerTranslationManifest(videoId);\n  if (!manifest || manifest.status !== "publishing") return manifest;\n  const db = database();\n  const now = new Date().toISOString();\n  if (await transcriptMatchesOwnerManifest(manifest)) {'''
          new = '''export async function reconcileOwnerPublishing(videoId: string) {\n  const manifest = await getOwnerTranslationManifest(videoId);\n  if (!manifest || manifest.status !== "publishing") return manifest;\n  const db = database();\n  const leaseRows = await db.query(\n    "SELECT lock_token,lock_expires_at FROM video_transcripts WHERE video_id=$1 LIMIT 1",\n    [videoId],\n  ) as { lock_token: string | null; lock_expires_at: string | null }[];\n  const lease = leaseRows[0];\n  const leaseActive = Boolean(lease?.lock_token && lease.lock_expires_at && Date.parse(lease.lock_expires_at) > Date.now());\n  const publishingAgeMs = Date.now() - Date.parse(manifest.updatedAt);\n  if (leaseActive || !Number.isFinite(publishingAgeMs) || publishingAgeMs < 10_000) return manifest;\n  const now = new Date().toISOString();\n  if (await transcriptMatchesOwnerManifest(manifest)) {'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    if (publishedRows.length !== 1) throw new Error("Το final owner manifest transition δεν ολοκληρώθηκε. Το manifest έμεινε σε publishing για recovery.");\n    const updated = await getOwnerTranslationManifest(videoId);\n    if (!updated || updated.revision !== manifest.revision || updated.status !== "published") throw new Error("Το published owner manifest δεν επιβεβαιώθηκε.");\n    return { manifest: updated, alreadyPublished: false };'''
          new = '''    if (publishedRows.length !== 1) {\n      const concurrent = await getOwnerTranslationManifest(videoId);\n      if (concurrent?.revision === manifest.revision && concurrent.status === "published") return { manifest: concurrent, alreadyPublished: false };\n      throw new Error("Το final owner manifest transition δεν ολοκληρώθηκε. Το manifest έμεινε σε publishing για recovery.");\n    }\n    const updated = await getOwnerTranslationManifest(videoId);\n    if (!updated || updated.revision !== manifest.revision || updated.status !== "published") throw new Error("Το published owner manifest δεν επιβεβαιώθηκε.");\n    return { manifest: updated, alreadyPublished: false };'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          p.write_text(text)
          Path('.github/workflows/temp-owner-reconcile-race.yml').unlink()
          PY
      - name: Commit race guard and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/api/owner-translation/store.ts .github/workflows/temp-owner-reconcile-race.yml
          git diff --cached --check
          git commit -m "Guard owner publishing reconcile races"
          git push origin HEAD:feature/owner-publishing-recovery
