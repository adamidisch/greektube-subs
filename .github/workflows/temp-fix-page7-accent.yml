name: Temp fix Natasha page 7 accent

on:
  push:
    branches:
      - temp/natasha-owner-import

permissions:
  contents: write

jobs:
  fix-page7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/natasha-owner-import
      - name: Fix only the page 7 sentence and remove this temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/temp-natasha-import/data/page-7.ts')
          text = path.read_text(encoding='utf-8')
          old = '[3017,"Ή χρησιμοποιήστε ένα ολόκληρο κοτόπουλο."]'
          new = '[3017,"Εναλλακτικά, χρησιμοποιήστε ένα ολόκληρο κοτόπουλο."]'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/temp-fix-page7-accent.yml')
          workflow.unlink()
          PY
      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/api/temp-natasha-import/data/page-7.ts .github/workflows/temp-fix-page7-accent.yml
          git diff --cached --check
          git commit -m "Fix Natasha page 7 Greek build blocker"
          git push origin HEAD:temp/natasha-owner-import