name: Fix v7.1.7 repair resilience

on:
  push:
    branches: [v7.1.7]
    paths:
      - .github/workflows/fix-v7.1.7-partial-repair.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7.1.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Keep safe repairs even if another cue is rejected
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/captions/route.ts')
          s=p.read_text()
          old='''      if (!expectedIds.has(index) || results.has(index)) return null;\n      const source = batch.find(item => item.index === index)?.text || "";\n      const candidate = match[2].replace(/\\s+/g, " ").trim();\n      if (!repairCandidateIsSafe(source, candidate)) return null;\n      results.set(index, candidate);\n    }\n    if (results.size !== batch.length || batch.some(item => !results.has(item.index))) return null;\n    return results;'''
          new='''      if (!expectedIds.has(index) || results.has(index)) return null;\n      const source = batch.find(item => item.index === index)?.text || "";\n      const candidate = match[2].replace(/\\s+/g, " ").trim();\n      // Keep each independently safe repair. If one cue is over-edited, only\n      // that cue falls back to the untouched raw transcript instead of\n      // discarding valid punctuation/ASR fixes for the whole batch.\n      if (repairCandidateIsSafe(source, candidate)) results.set(index, candidate);\n    }\n    return results.size ? results : null;'''
          if old not in s:
              raise SystemExit('repair parser block missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "GreekTube Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/captions/route.ts
          git commit -m "GreekTube Subs 7.1.7: keep safe per-cue ASR repairs"
          git push origin HEAD:v7.1.7
